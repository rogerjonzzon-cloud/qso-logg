name: Build APK on: workflow_dispatch: push: branches: [ main ] jobs: build: runs-on: ubuntu-24.04 timeout-minutes: 120 steps: - uses: actions/checkout@v5 - uses: actions/setup-python@v6 with: python-version: '3.12' - uses: actions/setup-java@v5 with: distribution: temurin java-version: '17' - name: Install system packages run: | sudo apt-get update sudo apt-get install -y \ git \ zip \ unzip \ autoconf \ libtool \ pkg-config \ zlib1g-dev \ libncurses-dev \ cmake \ libffi-dev \ libssl-dev \ build-essential - name: Install Android SDK packages run: | yes | sdkmanager --licenses || true sdkmanager "platform-tools" sdkmanager "platforms;android-35" sdkmanager "build-tools;35.0.0" - name: Install Buildozer run: | python -m pip install --upgrade pip pip install buildozer cython setuptools - name: Build APK run: | buildozer -v android debug - name: Upload APK uses: actions/upload-artifact@v4 with: name: apk path: bin/*.apk
