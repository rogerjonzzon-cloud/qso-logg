name: Build APK on: workflow_dispatch: push: branches: [ main ] jobs: build: runs-on: ubuntu-24.04 timeout-minutes: 120 steps: - name: Checkout uses: actions/checkout@v5 - name: Setup Python uses: actions/setup-python@v6 with: python-version: '3.12' - name: Setup Java uses: actions/setup-java@v5 with: distribution: temurin java-version: '17' - name: Install system packages run: | sudo apt-get update sudo apt-get install -y \ git \ zip \ unzip \ autoconf \ libtool \ pkg-config \ zlib1g-dev \ libncurses-dev \ cmake \ libffi-dev \ libssl-dev \ build-essential - name: Install Buildozer run: | python -m pip install --upgrade pip pip install buildozer==1.6.0 pip install cython setuptools - name: Configure Android SDK run: | echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV echo "ANDROIDAPI=33" >> $GITHUB_ENV echo "ANDROIDMINAPI=24" >> $GITHUB_ENV - name: Build APK run: | buildozer -v android debug - name: Upload APK uses: actions/upload-artifact@v4 with: name: qsologg-apk path: bin/*.apk if-no-files-found: error
